services:
    solar-persistence:
        image: solar-persistence
        healthcheck:
            test: "wget -T5 -qO- http://localhost:8081/actuator/health | grep UP || exit 1"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        environment:
            - TZ=Europe/Zurich
        ports:
            - 8081:8081
        restart: unless-stopped
        network_mode: host
    solar-backend:
        image: solar-backend
        healthcheck:
            test: "wget -T5 -qO- http://localhost:8080/actuator/health | grep UP || exit 1"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        depends_on:
            solar-persistence:
                condition: service_healthy
                restart: true
        environment:
            - TZ=Europe/Zurich
        ports:
            - 8080:8080
        restart: unless-stopped
        network_mode: host
    solar-weather-backend:
        image: solar-weather-backend
        healthcheck:
            test: "wget -T5 -qO- http://localhost:8082/actuator/health | grep UP || exit 1"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        depends_on:
            solar-persistence:
                condition: service_healthy
                restart: true
        environment:
            - TZ=Europe/Zurich
        ports:
            - 8082:8082
        restart: unless-stopped
        network_mode: host
    solar-frontend:
        image: solar-frontend
        depends_on:
            solar-backend:
                condition: service_healthy
                restart: true
        environment:
            - TZ=Europe/Zurich
        ports:
            - 80:80
        restart: unless-stopped
        network_mode: host
